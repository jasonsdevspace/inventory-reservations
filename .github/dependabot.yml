# Monthly checks for newer versions of everything this repo depends on, so minor and patch
# updates arrive once a month, one pull request per group, and are reviewed in one sitting.
# A major still comes in a pull request of its own.
# A version is offered on the first monthly run at least two weeks after its release, so one
# pulled soon after its release is never proposed. The base images are the exception, below.
#
# The workflow actions are pinned to commit hashes, which never move on their
# own, so without this they would quietly fall behind. Minor and patch updates
# are grouped into one pull request per ecosystem to keep the noise down, with
# TypeScript and its lint plugin in a group of their own, and the prose check
# in one of its own, since it moves in a pull request of its own.
# Security fixes arrive separately, as soon as an advisory is published.
# Each update carries the dependencies label alone, so pull requests sort by
# the kind of work rather than by the package manager.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      cooldown:
          default-days: 14
          # The house's own package skips the wait meant for releases from other authors, since
          # its versions are reviewed before they are promoted.
          exclude: ['@jasonsdevspace/prose-check']
      labels: ['dependencies']
      groups:
          # The prose check moves in a pull request of its own, since a new rule can fail this
          # repository's own text and should not hold back the other updates.
          prose-check:
              patterns: ['@jasonsdevspace/prose-check']
          # TypeScript and its lint plugin move together. typescript-eslint
          # names the TypeScript versions it supports down to the minor, so
          # Dependabot only offers a TypeScript minor once the plugin accepts it.
          typescript:
              patterns: ['typescript', 'typescript-eslint', '@typescript-eslint/*']
              update-types: [minor, patch]
          npm:
              update-types: [minor, patch]
      # A new TypeScript major waits for typescript-eslint to support it,
      # since the lint tooling refuses to install against an unsupported one.
      ignore:
          - dependency-name: typescript
            update-types: ['version-update:semver-major']
          # The Node types follow the Node major in .nvmrc.
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']

    # The browser demo has its own dependencies, pinned to exact versions.
    - package-ecosystem: npm
      directory: /demo
      schedule:
          interval: monthly
      cooldown:
          default-days: 14
      labels: ['dependencies']
      groups:
          demo:
              update-types: [minor, patch]
      # Kept on the same TypeScript major as the rest of the repo.
      ignore:
          - dependency-name: typescript
            update-types: ['version-update:semver-major']
          # The Node types follow the Node major in .nvmrc.
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      cooldown:
          default-days: 14
      labels: ['dependencies']
      groups:
          actions:
              patterns: ['*']

    # The base images in the Dockerfile, including the distroless runtime. Base images get no
    # security updates of their own, so a patched image arrives only on this schedule, which stays
    # weekly with a week's wait.
    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      labels: ['dependencies']
      # A Node major moves the build stages and the distroless runtime
      # together, along with .nvmrc, the engines field and the Node types in
      # the service and the demo, so it is a deliberate
      # upgrade rather than an automatic one. Only the build stages would move
      # here, leaving the image built on one Node and run on another.
      ignore:
          - dependency-name: node
            update-types: ['version-update:semver-major']

    # The database docker-compose.yml runs, pinned by digest, which CI's service image is held to.
    # Weekly with a week's wait, as the base images above, since it gets no security updates either.
    - package-ecosystem: docker-compose
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      labels: ['dependencies']
