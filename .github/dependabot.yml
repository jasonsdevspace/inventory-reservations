# Weekly checks for newer versions of everything this repo depends on.
#
# The workflow actions are pinned to commit hashes, which never move on their
# own, so without this they would quietly fall behind. Minor and patch updates
# are grouped into one pull request per ecosystem to keep the noise down.
# Security fixes arrive separately, as soon as an advisory is published.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          npm:
              update-types: [minor, patch]
      # A new TypeScript major waits for typescript-eslint to support it,
      # since the lint tooling refuses to install against an unsupported one.
      ignore:
          - dependency-name: typescript
            update-types: ['version-update:semver-major']

    # The browser demo has its own dependencies, pinned to exact versions.
    - package-ecosystem: npm
      directory: /demo
      schedule:
          interval: weekly
      groups:
          demo:
              update-types: [minor, patch]
      # Kept on the same TypeScript major as the rest of the repo.
      ignore:
          - dependency-name: typescript
            update-types: ['version-update:semver-major']

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']

    # The base images in the Dockerfile, including the distroless runtime.
    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
      # A Node major moves the build stages and the distroless runtime
      # together, along with CI and the engines field, so it is a deliberate
      # upgrade rather than an automatic one. Only the build stages would move
      # here, leaving the image built on one Node and run on another.
      ignore:
          - dependency-name: node
            update-types: ['version-update:semver-major']
