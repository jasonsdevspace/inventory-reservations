name: Pull request message

# A pull request's title, with its number, becomes the commit on main when it is
# squashed, and its body is what a reader of the pull request sees. Both are
# written on GitHub where no hook runs, so they pass the same check a commit
# message does, as written, headings included. The check is a workflow of its
# own, so an edit to the title or body runs it again without running CI. It runs
# the prose check's command at the version the lockfile pins, fetched alone with
# its install scripts off, after checking the registry's hash for that version
# against the lockfile's, which costs a few seconds where installing every
# dependency would cost about a minute.
# Dependabot's body quotes release notes written elsewhere, so only its title
# is held to the house rules.
on:
    pull_request:
        types: [opened, edited, reopened, synchronize]

permissions:
    contents: read

concurrency:
    group: message-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    message:
        name: PR title and body
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The Node the repository names in .nvmrc, not the runner's own.
            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            - name: Check the title and body
              env:
                  TITLE: ${{ github.event.pull_request.title }}
                  BODY: ${{ github.event.pull_request.body }}
                  AUTHOR: ${{ github.event.pull_request.user.login }}
              run: |
                  if [ "$AUTHOR" = "dependabot[bot]" ]; then
                      printf '%s\n' "$TITLE" > "$RUNNER_TEMP/message"
                  else
                      printf '%s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/message"
                  fi
                  read -r version integrity < <(node -p "const p = require('./package-lock.json').packages['node_modules/@jasonsdevspace/prose-check']; p.version + ' ' + p.integrity")
                  if [ "$(npm view "@jasonsdevspace/prose-check@$version" dist.integrity)" != "$integrity" ]; then
                      echo "the registry's hash for the prose check $version does not match the lockfile's"
                      exit 1
                  fi
                  npm exec --yes --ignore-scripts --package="@jasonsdevspace/prose-check@$version" -- check-commit-message --as-is "$RUNNER_TEMP/message"
