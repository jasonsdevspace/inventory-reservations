name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest

        # The integration tests talk to a real Postgres, because the behaviour
        # under test belongs to the database: row locking, isolation levels and
        # serialisation failures. The health check matters, since the suite
        # starts querying as soon as the job does.
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: reservations
                    POSTGRES_PASSWORD: reservations
                    POSTGRES_DB: reservations
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U reservations -d reservations"
                    --health-interval 2s
                    --health-timeout 3s
                    --health-retries 15

        env:
            DATABASE_URL: postgres://reservations:reservations@localhost:5432/reservations

        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Type-check
              run: npm run type-check

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Prose check
              run: npm run prose

            - name: Test
              run: npm run test:run
