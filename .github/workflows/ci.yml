name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    # A deploy by hand, which still runs every check first.
    workflow_dispatch:

permissions:
    contents: read

# A newer push to a pull request supersedes the run in progress. A push to
# main does not: a run that has handed an artifact to Pages and is then
# canceled leaves the deployment pending, so runs on main wait their turn.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify:
        runs-on: ubuntu-latest

        # The integration tests talk to a real Postgres, because the behavior
        # under test belongs to the database: row locking, isolation levels and
        # serialization failures. The health check matters, since the suite
        # starts querying as soon as the job does.
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: reservations
                    POSTGRES_PASSWORD: reservations
                    POSTGRES_DB: reservations
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U reservations -d reservations"
                    --health-interval 2s
                    --health-timeout 3s
                    --health-retries 15

        env:
            DATABASE_URL: postgres://reservations:reservations@localhost:5432/reservations_test
            APP_DATABASE_URL: postgres://reservations_app:reservations_app@localhost:5432/reservations_test

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: |
                      package-lock.json
                      demo/package-lock.json

            # Service containers cannot run an init script, so the database
            # the suite uses is created here instead. Locally the same thing
            # happens through docker/init-test-db.sql.
            - name: Create the test database
              run: PGPASSWORD=reservations createdb -h localhost -U reservations reservations_test

            - name: Install dependencies
              run: npm ci

            # The lint reads types, and it covers the demo's files too, so
            # the demo's own dependencies have to be present for it.
            - name: Install the demo's dependencies
              run: npm ci
              working-directory: demo

            - name: Type-check
              run: npm run type-check

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Prose check
              run: npm run prose

            - name: Test
              run: npm run test:run

            # The image runs the compiled output, which reads its SQL from
            # beside it. Migrating from dist catches a build that compiles but
            # leaves the schema behind.
            - name: Build and migrate from the compiled output
              run: npm run build && node dist/postgres/migrate/migrate-cli.js
              env:
                  APP_DB_PASSWORD: reservations_app

    # The browser demo runs the service's own store against Postgres in the
    # page. Its tests check the claims the page makes to a visitor, and the
    # build catches the store picking up anything a browser cannot load.
    # The build is then visited in a real browser, desktop and phone, with
    # an axe audit on each visit, and audited by Lighthouse with budgets.
    # It is built for the project site's path, so what is checked is the
    # page a visitor receives rather than a copy served from the root.
    demo:
        runs-on: ubuntu-latest
        env:
            DEMO_BASE: /inventory-reservations/
        defaults:
            run:
                working-directory: demo
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: demo/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Test against Postgres in the page
              run: npm test

            - name: Type-check and build
              run: npm run build

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: Browser tests
              run: npm run e2e

            # Accessibility has to score a hundred, and the page has to stay
            # inside its budgets. Runs against the build the browser tests used.
            - name: Lighthouse audit
              run: npm run lighthouse

            - name: Keep the report when something fails
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: demo/playwright-report
                  retention-days: 7

    # The browser demo, published to GitHub Pages at /inventory-reservations/
    # once everything above has passed on main. A merge that fails a check,
    # including the tests against Postgres, the browser tests and the
    # Lighthouse audit, is never deployed.
    deploy:
        needs: [verify, demo]
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        # A job's own permissions replace the workflow's, so the read the
        # checkout needs is named here beside the two Pages needs.
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        defaults:
            run:
                working-directory: demo
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: demo/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build for the project site
              run: npm run build
              env:
                  DEMO_BASE: /inventory-reservations/

            - name: Configure Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Upload the site
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: demo/dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
